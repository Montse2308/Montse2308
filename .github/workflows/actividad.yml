name: Update activity graph

on:
  schedule:
    - cron: "0 12 1 * *" # first day of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actividad:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - run: python scripts/generar.py --actividad
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the graph changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-*.svg
          git diff --cached --quiet || git commit -m "chore: update activity graph"
          git push
